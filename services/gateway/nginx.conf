# Generated by `python -m services.gateway`. Do not edit by hand.
events {}

http {
    server {
        listen 80;
        client_max_body_size 20m;

        # Look service addresses up at request time (Docker DNS) so a restarted
        # container with a new IP is still reached.
        resolver 127.0.0.11 valid=10s ipv6=off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        location = /gateway/health { return 200 "ok\n"; }

        location = /registrationRoute/register_user { set $service auth; proxy_pass http://$service:8000; }
        location = /registrationRoute/check_email_exists { set $service auth; proxy_pass http://$service:8000; }
